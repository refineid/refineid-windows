name: Windows portability

# Windows-host portability checks for the WinUI apps and native bridges.
# Formatting, lint, and core tests run in the mandatory local hooks.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: windows-portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustup honours rust-toolchain.toml (channel, clippy, rustfmt, and the
      # windows-msvc targets); the first cargo call installs it.
      - name: Show Rust toolchain
        run: rustup show

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # The Rust bridges the WinUI apps load; built explicitly into target/debug
      # so the C# build can skip its own cargo invocation and just consume the
      # cdylibs the projects' Content items copy.
      - name: Build RAPP and Settings bridges
        run: cargo build -p refineid-rapp-ffi -p refineid-settings-ffi

      # TreatWarningsAsErrors and EnforceCodeStyleInBuild are set in the
      # project, so a clean build is itself the analyzer gate.
      - name: Build requester
        run: >-
          dotnet build apps/RefineID-winui/RefineID.csproj
          -c Debug -p:Platform=x64 -p:SkipRustBuild=true
          -p:WindowsPackageType=None -p:EnableMsixTooling=false
