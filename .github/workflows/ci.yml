name: CI

# The authoritative format, lint, and build gate. The Windows Card Module and
# credential-store crates only compile against the Windows target, and the
# WinUI requester needs the Windows workload, so the whole gate runs on a
# Windows runner. The local pre-commit hook runs the cross-platform subset it
# can (see .githooks/pre-commit); this job is what a pull request must pass.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # rustup honours rust-toolchain.toml (channel, clippy, rustfmt, and the
      # windows-msvc targets); the first cargo call installs it.
      - name: Show Rust toolchain
        run: rustup show

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Cheap, source-only formatting checks fail fast before any build. rustfmt
      # covers Rust; CSharpier covers C#, XAML, and the project files.
      - name: Rust formatting
        run: cargo fmt --all --check

      - name: C# and XAML formatting
        run: |
          dotnet tool restore
          dotnet csharpier check .

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Requester core tests
        run: cargo test -p refineid-lib-core

      # The Rust bridges the WinUI apps load; built explicitly into target/debug
      # so the C# build can skip its own cargo invocation and just consume the
      # cdylibs the projects' Content items copy.
      - name: Build RAPP and Settings bridges
        run: cargo build -p refineid-rapp-ffi -p refineid-settings-ffi

      # TreatWarningsAsErrors and EnforceCodeStyleInBuild are set in the
      # project, so a clean build is itself the analyzer gate.
      - name: Build requester
        run: >-
          dotnet build apps/RefineID-winui/RefineID.csproj
          -c Debug -p:Platform=x64 -p:SkipRustBuild=true
          -p:WindowsPackageType=None -p:EnableMsixTooling=false

      - name: Build settings app
        run: >-
          dotnet build apps/RefineID.Settings/RefineID.Settings.csproj
          -c Debug -p:Platform=x64 -p:SkipRustBuild=true
          -p:WindowsPackageType=None -p:EnableMsixTooling=false
