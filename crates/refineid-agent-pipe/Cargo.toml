[package]
name = "refineid-agent-pipe"
description = "The named pipe between the RefineID key storage provider and the per-user agent that holds the phone's Bluetooth session"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
refineid-rapp.workspace = true
refineid-rapp-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }

[lints]
workspace = true