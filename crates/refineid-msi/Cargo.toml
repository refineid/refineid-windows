[package]
name = "refineid-msi"
description = "Authors the Windows Installer package for the Card Module using only the Windows Installer API. No third-party packaging toolchain."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "refineid-msi"
path = "src/main.rs"

# The card registrations and the INF derived from them are portable, so
# their tests run on any host.
[dependencies]
refineid-lib-core.workspace = true

# The package writer is `#[cfg(windows)]`; the Windows Installer database
# API exists only there.
[target.'cfg(windows)'.dependencies]
sha1.workspace = true
windows-sys.workspace = true
