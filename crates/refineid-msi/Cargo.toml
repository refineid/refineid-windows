[package]
name = "refineid-msi"
description = "Authors the Windows Installer package for the Card Module using only the Windows Installer API. No third-party packaging toolchain."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "refineid-msi"
path = "src/main.rs"

# All real code is `#[cfg(windows)]`; the Windows Installer database API
# exists only there. On other targets the crate is intentionally empty so
# a cross-platform workspace build stays green.
[target.'cfg(windows)'.dependencies]
sha1.workspace = true
windows-sys.workspace = true
