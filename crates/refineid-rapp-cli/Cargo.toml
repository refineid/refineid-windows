[package]
name = "refineid-rapp-cli"
description = "Development requester CLI for the RAPP remote-card path"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "refineid-rapp"
path = "src/main.rs"

[dependencies]
getrandom.workspace = true
hex.workspace = true
p384 = { version = "0.14", default-features = false, features = ["ecdsa"] }
refineid-lib-core.workspace = true
refineid-rapp.workspace = true
refineid-rapp-core.workspace = true
refineid-rapp-ble.workspace = true
refineid-windows-credential-store.workspace = true
sec1 = { version = "0.8", default-features = false, features = ["der"] }
zeroize.workspace = true

[dev-dependencies]
sha2.workspace = true

[lints]
workspace = true
