[package]
name = "refineid-windows-credential-store"
description = "Windows Credential Manager boundary for card-bound RefineID NFC access numbers"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
refineid-dev-errors.workspace = true
refineid-lib-core.workspace = true
refineid-rapp-core.workspace = true
zeroize.workspace = true

[dev-dependencies]
refineid-rapp.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
] }
